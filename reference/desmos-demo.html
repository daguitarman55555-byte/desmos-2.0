<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled Graph</title>
<link rel="stylesheet" href="vendor/mathquill.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
  background: #fff; color: #000; -webkit-font-smoothing: antialiased;
}
#app { display: flex; flex-direction: column; height: 100%; }

/* ===================== HEADER ===================== */
#topbar {
  height: 44.8px; flex: 0 0 44.8px; background: #2f2f2f;
  display: flex; align-items: center; position: relative; z-index: 30; user-select: none;
}
#topbar .left  { display: flex; align-items: center; padding-left: 9.6px; min-width: 0; flex: 0 1 auto; }
#topbar .right { display: flex; align-items: center; margin-left: auto; padding-right: 9.6px; flex: 0 0 auto; }

.hdr-icon-btn {
  width: 33.6px; height: 33.6px; border: 0; background: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; border-radius: 2.4px;
}
.hdr-icon-btn:hover { background: rgba(255,255,255,.13); }
#doc-divider { width: 0.8px; height: 19.2px; background: #6e6e6e; margin: 0 11.2px 0 4.8px; }
#doc-title { color: #fff; font-size: 14.4px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#save-btn {
  margin-left: 12.8px; height: 30.4px; padding: 0 16.8px; border: 0; border-radius: 2.4px;
  font-size: 12px; font-family: inherit; background: #4a4a4a; color: #a8a8a8; cursor: default;
  transition: background .12s, color .12s;
}
#save-btn.dirty { background: #2f72dc; color: #fff; cursor: pointer; }
#save-btn.dirty:hover { background: #2b68c7; }

#wordmark {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
  color: #fff; font-size: 25.6px; line-height: 1; pointer-events: none;
  font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-weight: 300; letter-spacing: 0.96px;
}

.hdr-btn { height: 33.6px; padding: 0 15px; border-radius: 2.4px; font-size: 12px; font-family: inherit; cursor: pointer; white-space: nowrap; }
#login-btn  { background: transparent; color: #fff; border: 0.8px solid #9a9a9a; margin-right: 8px; }
#login-btn:hover { background: rgba(255,255,255,.1); }
#signup-btn { background: #2f72dc; color: #fff; border: 0.8px solid #2f72dc; margin-right: 8px; }
#signup-btn:hover { background: #2b68c7; }

/* ===================== BODY ===================== */
#body { flex: 1 1 auto; display: flex; min-height: 0; }

/* ===================== PANEL ===================== */
#panel {
  width: 466.4px; flex: 0 0 auto; max-width: 68%; min-width: 192px;
  background: #fff; display: flex; flex-direction: column;
  position: relative; border-right: 0.8px solid #cbcbcb;
}
#panel.collapsed { width: 0; min-width: 0; border-right: 0; overflow: hidden; }
#panel.collapsed + #resizer { display: none; }

#panel-toolbar {
  height: 51.2px; flex: 0 0 51.2px; display: flex; align-items: center;
  padding: 0 9.6px 0 6.4px; border-bottom: 0.8px solid #cbcbcb; background: #fff;
}
.tool-btn {
  width: 35.2px; height: 35.2px; border: 0; background: none; cursor: pointer; color: #3b3b3b;
  display: flex; align-items: center; justify-content: center; border-radius: 2.4px; flex: 0 0 35.2px;
}
.tool-btn:hover { background: #ededed; }
.tool-btn:disabled { color: #b8b8b8; cursor: default; }
.tool-btn:disabled:hover { background: none; }
.tb-gap { flex: 1 1 auto; }

#expr-list { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; }
#expr-list::-webkit-scrollbar { width: 8px; }
#expr-list::-webkit-scrollbar-thumb { background: #cacaca; border-radius: 4px; }

/* ---- expression row ---- */
.expr-row {
  display: flex; align-items: stretch; min-height: 59.2px; position: relative; background: #fff;
  border-top: 0.8px solid transparent; border-bottom: 0.8px solid #cbcbcb; margin-top: -0.8px;
}
.expr-row.focused { border-top-color: #2f72dc; border-bottom-color: #2f72dc; z-index: 2; }

.expr-index {
  width: 37.6px; flex: 0 0 37.6px; background: #f5f5f5; border-right: 0.8px solid #cbcbcb;
  position: relative; user-select: none; cursor: pointer;
}
.expr-row.focused .expr-index { background: #2f72dc; border-right-color: #2f72dc; }
.idx-num { position: absolute; left: 4px; top: 2.4px; font-size: 9.6px; color: #909090; line-height: 1; }
.expr-row.focused .idx-num { color: #fff; }

.idx-icon {
  position: absolute; left: 50%; transform: translateX(-50%); top: 15.2px;
  width: 24px; height: 24px; cursor: pointer; display: none;
}
.idx-icon.show { display: block; }
.idx-icon2 {
  position: absolute; left: 50%; transform: translateX(-50%); top: 49.6px;
  width: 20.8px; height: 20.8px; cursor: pointer; display: none;
}
.idx-icon2.show { display: block; }

.expr-body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; padding: 10.4px 32px 10.4px 9.6px; }
.expr-math { min-height: 36.8px; display: flex; align-items: center; }

.expr-del {
  position: absolute; right: 8px; top: 19px; width: 24px; height: 24px;
  border: 0; background: none; cursor: pointer; color: #5e5e5e; border-radius: 2.4px;
  display: none; align-items: center; justify-content: center;
}
.expr-del.show { display: flex; }
.expr-del:hover { background: #ededed; color: #000; }

/* ---- slider ---- */
.slider-row { display: none; align-items: center; gap: 8px; margin-top: 8px; padding-right: 6.4px; }
.slider-row.show { display: flex; }
.sl-lim { font-size: 11.2px; color: #666; min-width: 20.8px; text-align: center; user-select: none; cursor: pointer; }
.sl-track { position: relative; flex: 1 1 auto; height: 16px; cursor: pointer; }
.sl-track::before {
  content: ''; position: absolute; left: 0; right: 0; top: 6.4px; height: 3.2px;
  background: #dcdcdc; border-radius: 1.6px;
}
.sl-tick { position: absolute; top: 4.8px; width: 0.8px; height: 6.4px; background: #bdbdbd; }
.sl-thumb {
  position: absolute; top: 2.4px; width: 11.2px; height: 11.2px; margin-left: -5.6px;
  background: #2f72dc; border-radius: 50%; box-shadow: 0 0 0 4px rgba(47,114,220,.20);
}

/* ---- bounds editor ---- */
.bounds-row { display: none; align-items: center; flex-wrap: wrap; row-gap: 4.8px; margin-top: 9.6px; font-size: 15.2px; color: #000; min-width: 0; }
.bounds-row.show { display: flex; }
.bounds-row .bf {
  width: 36.8px; border: 0; border-bottom: 0.8px solid #9a9a9a; outline: none; background: transparent;
  font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 15.2px; text-align: center; padding: 0 1.6px 1.6px;
}
.bounds-row .bsym { font-family: "Times New Roman", Times, serif; font-style: italic; margin: 0 6.4px; }
.bounds-row .bstep { margin-left: 20.8px; font-size: 12.8px; font-style: normal; font-family: inherit; }
.bounds-row .bstep .bf { margin-left: 6.4px; width: 49.6px; }

/* ---- panel furniture ---- */
#panel-footer {
  position: absolute; bottom: 8px; left: 0; right: 0; text-align: center;
  pointer-events: none; font-size: 9.6px; color: #b6b6b6; letter-spacing: 0.16px;
}
#panel-footer .pb-word {
  display: block; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
  font-weight: 300; font-size: 20.8px; color: #c2c2c2; line-height: 1.05; margin-top: 1.6px; letter-spacing: 0.48px;
}
#keypad-btn {
  position: absolute; left: 9.6px; bottom: 9.6px; width: 68px; height: 38.4px;
  background: #fff; border: 0.8px solid #cbcbcb; border-radius: 3.2px;
  display: flex; align-items: center; justify-content: center; gap: 5.6px;
  cursor: pointer; box-shadow: 0 0.8px 1.6px rgba(0,0,0,.07); z-index: 6;
}
#keypad-btn:hover { background: #f6f6f6; }
#login-toast {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 52.8px;
  width: 269.6px; max-width: calc(100% - 19.2px); background: #fff;
  border: 0.8px solid #dedede; border-radius: 4px; box-shadow: 0 1.6px 4px rgba(0,0,0,.13);
  padding: 8.4px 27.2px 8.4px 11.2px; display: flex; align-items: center; gap: 10.4px; z-index: 5;
}
#login-toast .toast-text { font-size: 12.8px; line-height: 1.38; }
#login-toast a { color: #2f72dc; text-decoration: underline; cursor: pointer; }
#toast-close {
  position: absolute; right: 5.6px; top: 50%; transform: translateY(-50%);
  border: 0; background: none; cursor: pointer; color: #4a4a4a; padding: 3.2px; display: flex;
}

#resizer { width: 4px; flex: 0 0 4px; margin-left: -2.4px; cursor: col-resize; z-index: 10; }

/* ===================== GRAPH ===================== */
#graph-wrap { flex: 1 1 auto; position: relative; min-width: 0; background: #fff; overflow: hidden; }
#graph { display: block; width: 100%; height: 100%; }
#graph-overlay { position: absolute; inset: 0; pointer-events: none; z-index: 3; overflow: hidden; }
.pt-label {
  position: absolute; pointer-events: auto; display: flex; align-items: center; gap: 6.4px;
  background: #fff; border: 0.8px solid #c4c4c4; border-radius: 3.2px;
  box-shadow: 0 1.6px 4px rgba(0,0,0,.17); padding: 3.2px 6.4px; white-space: nowrap;
  font-family: "Times New Roman", Times, serif; font-style: italic; font-size: 16px; color: #000;
}
.pt-export {
  width: 13.6px; height: 13.6px; flex: 0 0 13.6px; padding: 0;
  border: 0; background: none; cursor: pointer; color: #4d4d4d;
}
.pt-export:hover { color: #000; }

#graph-tools { position: absolute; right: 4px; top: 7px; display: flex; flex-direction: column; gap: 7.2px; z-index: 4; }
.gbtn {
  width: 35.2px; height: 35.2px; background: #fff; border: 0.8px solid #cbcbcb;
  display: flex; align-items: center; justify-content: center; cursor: pointer; color: #4d4d4d;
}
.gbtn:hover { background: #f2f2f2; }
.zoom-group { display: flex; flex-direction: column; }
.zoom-group .gbtn + .gbtn:not([hidden]) { border-top: 0; }
.gbtn[hidden] { display: none; }

/* ===================== MATHQUILL OVERRIDES ===================== */
.mq-editable-field, .mq-math-mode { border: 0 !important; }
.mq-editable-field.mq-focused { box-shadow: none !important; border: 0 !important; outline: none !important; }
.expr-math .mq-editable-field { font-size: 18.4px; width: 100%; }
.expr-math .mq-root-block { padding: 1.6px 0; }
.mq-editable-field .mq-cursor { border-left: 0.8px solid #000; }

/* ===================== RESPONSIVE ===================== */
@media (max-width: 1080px) { #wordmark { font-size: 21.6px; } }
@media (max-width: 900px)  { #wordmark { display: none; } }
@media (max-width: 760px)  {
  #login-btn { display: none; }
  #doc-title { max-width: 104px; }
}
@media (max-width: 620px)  {
  #signup-btn { display: none; }
  #panel { max-width: 100%; }
}
@media (max-height: 560px) { #panel-footer, #login-toast { display: none; } }
</style>
</head>
<body>
<div id="app">

  <!-- ===================== HEADER ===================== -->
  <header id="topbar">
    <div class="left">
      <button class="hdr-icon-btn" title="Open Graph">
        <svg width="20" height="25" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2.6 18.6V5.4A1.4 1.4 0 0 1 4 4h4.4l1.9 2.2H15.8a1.4 1.4 0 0 1 1.4 1.4v1.5"/>
          <path d="M2.6 18.6l2.9-8.1A1.2 1.2 0 0 1 6.6 9.7H21a.9.9 0 0 1 .86 1.2l-2.6 7.7z"/>
        </svg>
      </button>
      <div id="doc-divider"></div>
      <span id="doc-title">Untitled Graph</span>
      <button id="save-btn">Save</button>
    </div>

    <div id="wordmark">desmos</div>

    <div class="right">
      <button class="hdr-btn" id="login-btn">Log In</button>
      <button class="hdr-btn" id="signup-btn">Sign Up</button>
      <button class="hdr-icon-btn" title="Share Graph">
        <svg width="19.2" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 10.5H5.6A1.6 1.6 0 0 0 4 12.1v6.3A1.6 1.6 0 0 0 5.6 20h12.8a1.6 1.6 0 0 0 1.6-1.6v-6.3a1.6 1.6 0 0 0-1.6-1.6H16"/>
          <path d="M12 14.6V4"/><path d="M8.3 7.5L12 3.8l3.7 3.7"/>
        </svg>
      </button>
      <button class="hdr-icon-btn" title="Help">
        <svg width="19.2" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.1"/>
          <path d="M9.3 9.3a2.75 2.75 0 1 1 3.45 2.65c-.62.19-.83.7-.83 1.33v.55"/>
          <circle cx="11.95" cy="16.9" r="1.05" fill="#fff" stroke="none"/>
        </svg>
      </button>
      <button class="hdr-icon-btn" title="Language">
        <svg width="19.2" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9.1"/><path d="M2.9 12h18.2"/>
          <path d="M12 2.9c2.5 2.55 3.85 5.75 3.85 9.1S14.5 18.55 12 21.1c-2.5-2.55-3.85-5.75-3.85-9.1S9.5 5.45 12 2.9z"/>
        </svg>
      </button>
      <button class="hdr-icon-btn" title="Desmos">
        <svg width="25.6" height="32" viewBox="0 0 32 32" fill="none">
          <path d="M7 8.5c0 10.2 3.7 15.5 9 15.5s9-5.3 9-15.5" stroke="#3ec415" stroke-width="3.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ===================== BODY ===================== -->
  <div id="body">
    <div id="panel">
      <div id="panel-toolbar">
        <button class="tool-btn" id="add-btn" title="Add Item">
          <svg width="22.4" height="28" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"><path d="M12 4.6v14.8M4.6 12h14.8"/></svg>
        </button>
        <div class="tb-gap"></div>
        <button class="tool-btn" id="undo-btn" title="Undo" disabled>
          <svg width="21.6" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.2 8.6h10.6a5.4 5.4 0 1 1 0 10.8H9.2"/><path d="M8.1 4.7L4.2 8.6l3.9 3.9"/>
          </svg>
        </button>
        <button class="tool-btn" id="redo-btn" title="Redo" disabled>
          <svg width="21.6" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19.8 8.6H9.2a5.4 5.4 0 1 0 0 10.8h5.6"/><path d="M15.9 4.7l3.9 3.9-3.9 3.9"/>
          </svg>
        </button>
        <div class="tb-gap"></div>
        <button class="tool-btn" id="settings-btn" title="Graph Settings">
          <svg width="20.8" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.55">
            <circle cx="12" cy="12" r="3.1"/>
            <path d="M19.1 14.7a1.55 1.55 0 0 0 .31 1.71l.06.06a1.85 1.85 0 1 1-2.62 2.62l-.05-.06a1.55 1.55 0 0 0-1.72-.31 1.55 1.55 0 0 0-.94 1.42v.16a1.85 1.85 0 1 1-3.7 0v-.09a1.55 1.55 0 0 0-1.02-1.42 1.55 1.55 0 0 0-1.71.31l-.06.06a1.85 1.85 0 1 1-2.62-2.62l.06-.06a1.55 1.55 0 0 0 .31-1.71 1.55 1.55 0 0 0-1.42-.94H3.7a1.85 1.85 0 1 1 0-3.7h.09a1.55 1.55 0 0 0 1.42-1.02 1.55 1.55 0 0 0-.31-1.71l-.06-.06A1.85 1.85 0 1 1 7.46 4.8l.06.06a1.55 1.55 0 0 0 1.71.31h.08a1.55 1.55 0 0 0 .94-1.42V3.7a1.85 1.85 0 1 1 3.7 0v.09a1.55 1.55 0 0 0 .94 1.42 1.55 1.55 0 0 0 1.72-.31l.05-.06a1.85 1.85 0 1 1 2.62 2.62l-.06.06a1.55 1.55 0 0 0-.31 1.71v.08a1.55 1.55 0 0 0 1.42.94h.16a1.85 1.85 0 1 1 0 3.7h-.09a1.55 1.55 0 0 0-1.4.75z"/>
          </svg>
        </button>
        <button class="tool-btn" id="collapse-btn" title="Hide Expressions List">
          <svg width="21.6" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M13.2 5.6L6.8 12l6.4 6.4"/><path d="M18.6 5.6L12.2 12l6.4 6.4"/>
          </svg>
        </button>
      </div>

      <div id="expr-list"></div>

      <div id="panel-footer">powered by<span class="pb-word">desmos</span></div>

      <div id="keypad-btn" title="Keypad">
        <svg width="21.6" height="19" viewBox="0 0 27 19" fill="none" stroke="#3f3f3f" stroke-width="1.25">
          <rect x="0.9" y="0.9" width="25.2" height="17.2" rx="2.2"/>
          <path d="M4.2 5.4h1.7M8.2 5.4h1.7M12.2 5.4h1.7M16.2 5.4h1.7M20.2 5.4h1.7M4.2 9.4h1.7M8.2 9.4h1.7M12.2 9.4h1.7M16.2 9.4h1.7M20.2 9.4h1.7M8 13.4h11" stroke-linecap="round"/>
        </svg>
        <svg width="11.2" height="9" viewBox="0 0 14 9" fill="none" stroke="#3f3f3f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1.6 6.9L7 1.9l5.4 5"/></svg>
      </div>

      <div id="login-toast">
        <svg width="38.4" height="38" viewBox="0 0 48 38" fill="none" style="flex:0 0 48px">
          <path d="M7 5c0 16.5 7.4 27 17 27s17-10.5 17-27" stroke="#232323" stroke-width="5.6" stroke-linecap="round"/>
        </svg>
        <div class="toast-text"><a>Log in</a> or <a>sign up</a> to save your beautiful math!</div>
        <button id="toast-close" title="Dismiss">
          <svg width="13.6" height="17" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"><path d="M5 5l14 14M19 5L5 19"/></svg>
        </button>
      </div>
    </div>

    <div id="resizer"></div>

    <div id="graph-wrap">
      <canvas id="graph"></canvas>
      <div id="graph-overlay"></div>
      <div id="graph-tools">
        <button class="gbtn" id="wrench-btn" title="Graph Settings">
          <svg width="18.4" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 6.6a4.1 4.1 0 0 0 5.3 5.3l-8.4 8.4a2.45 2.45 0 1 1-3.5-3.5z"/>
            <path d="M15 6.6L17.4 4a4.1 4.1 0 0 1 2.9 7.9"/>
          </svg>
        </button>
        <div class="zoom-group">
          <button class="gbtn" id="zoom-in" title="Zoom In"><svg width="18.4" height="23" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="gbtn" id="zoom-out" title="Zoom Out"><svg width="18.4" height="23" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" fill="none"><path d="M5 12h14"/></svg></button>
          <button class="gbtn" id="home-btn" title="Default Viewport" hidden>
            <svg width="18.4" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.4 10.4L12 3.4l8.6 7"/><path d="M5.6 9.1v10.3h12.8V9.1"/><path d="M9.9 19.4v-5.6h4.2v5.6"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="vendor/jquery.min.js"></script>
<script src="vendor/mathquill.min.js"></script>
<script>
/* =========================================================================
   DESMOS 2.0 — UI shell + MathQuill live math fields
   ========================================================================= */
const MQ = MathQuill.getInterface(2);
const AUTO_OPS = 'sin cos tan sec csc cot arcsin arccos arctan sinh cosh tanh '
  + 'arcsinh arccosh arctanh ln log exp abs sign floor ceil round mod gcd lcm '
  + 'min max mean median stdev total length nCr nPr';

/* ------------------------- LaTeX -> plain source ------------------------- */
function readGroup(s, i) {              // s[i] must be '{'
  let d = 0;
  for (let j = i; j < s.length; j++) {
    if (s[j] === '{') d++;
    else if (s[j] === '}') { d--; if (!d) return [s.slice(i + 1, j), j + 1]; }
  }
  return [s.slice(i + 1), s.length];
}
function latexToSrc(tex) {
  let s = tex, out = '', i = 0;
  s = s.replace(/\\left|\\right/g, '')
       .replace(/\\cdot|\\times/g, '*')
       .replace(/\\div/g, '/')
       .replace(/\\ /g, '')

  const hasSlider = has && !e.err && !!e.sliderKind;

  const showErr = has && e.err;

      btn.innerHTML = '<svg viewBox="0 0 24 24" width="100%" height="100%" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19V6a1.5 1.5 0 0 1 1.5-1.5H11"/><path d="M15 3.6h5.4V9"/><path d="M20.4 3.6L11.4 12.6"/></svg>';

      if (!best || d < best.d) best = { d, sx: p[i], sy: p[i + 1] };

  if (poi || hit) {                                // press on a curve starts a trace drag
    mode = 'trace';
    if (hit) {
      traceExpr = hit.e; selectedId = hit.e.id; focusedId = hit.e.id; refreshFocusClasses();
      hoverPt = { x: toMX(hit.sx), y: toMY(hit.sy), type: 'trace' };
    } else {

    gmoved = true; userMoved = true; canvas.style.cursor = 'move';
    view.cx -= (ev.clientX - lx) / view.ppu; view.cy += (ev.clientY - ly) / view.ppu;
    lx = ev.clientX; ly = ev.clientY; draw();

const homeBtn = document.getElementById('home-btn');
homeBtn.onclick = () => { userMoved = false; fitView(); draw(); };
document.getElementById('add-btn').onclick = () => { const e = newExpr(''); exprs.push(e); render(); focusExpr(e); };
document.getElementById('toast-close').onclick = () => document.getElementById('login-toast').style.display = 'none';
document.getElementById('collapse-btn').onclick = () => {
  document.getElementById('panel').classList.toggle('collapsed'); requestAnimationFrame(resize);
};

const resizer = document.getElementById('resizer'), panel = document.getElementById('panel');
let rz = false;
resizer.addEventListener('mousedown', e => { rz = true; e.preventDefault(); document.body.style.cursor = 'col-resize'; });
window.addEventListener('mousemove', e => { if (!rz) return;
  const w = Math.max(192, Math.min(Math.round(window.innerWidth * 0.68), e.clientX));
  panel.style.width = w + 'px'; });
window.addEventListener('mouseup', () => { if (rz) { rz = false; document.body.style.cursor = ''; } });

/* the canvas tracks its own box, so window resizes, panel drags and panel
   collapse all reflow through one code path */
new ResizeObserver(() => resize()).observe(document.getElementById('graph-wrap'));
window.addEventListener('resize', resize);

/* ------------------------- boot ------------------------- */
exprs = [newExpr('')];
focusedId = exprs[0].id;
render(); resize(); focusExpr(exprs[0]); pushHistory();
</script>
</body>
</html>
